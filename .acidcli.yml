# Copyright Altran Netherlands B.V

project: espilce-commons
language: MDE
code_location:
  source:
    - .
artifact_repository_url: "https://nexus.acidspace.nl/repository/{}/"

release:
  binaries:
    precondition:
      - VersionDetermined
      - OutputDirectoryExists
      - OutputDirectoryIsEmpty
    parameters:
      artifact_repository: "MDEAssets"
      artifact_regex: "espilce-commons\/{}\/.*"
      artifact_source_url: "https://nexus.acidspace.nl/service/rest/v1/assets?repository=MDEAssets"
      artifact_target_dir: ./releng/org.espilce.commons.repository/downloaded-repository/
      parent_pom: releng/org.espilce.commons.parent/pom.xml
      publish_pom: releng/org.espilce.commons.repository/pom.xml
      output: ./release/binaries/
